steps:
- id: s01_open_member_inquiry_to
  intent: Open Member Inquiry to look up the member
  screen: functions
  origin: model
  action: click
  target: member_inquiry_link
  risk: safe
  expect:
    screen: member_inquiry
    timeout_ms: 10000
- id: s02_enter_the_member_number
  intent: Enter the member number to search
  screen: member_inquiry
  origin: model
  action: fill
  target: member_number_input
  value:
    param: member_number
  risk: reversible
- id: s03_search_for_the_member
  intent: Search for the member record
  screen: member_inquiry
  origin: model
  action: click
  target: search_clickable
  risk: safe
  expect:
    screen: member_detail
    timeout_ms: 10000
- id: s04_begin_opening_a_new
  intent: Begin opening a new sub-account for the member
  screen: member_detail
  origin: model
  action: click
  target: open_sub_account_link
  risk: safe
  expect:
    screen: open_sub_account
    timeout_ms: 10000
- id: s05_select_the_product_for
  intent: Select the product for the new sub-account
  screen: open_sub_account
  origin: model
  action: select
  target: product_select
  value:
    param: product
  match: label
  risk: reversible
- id: s06_enter_the_nickname_for
  intent: Enter the nickname for the new sub-account
  screen: open_sub_account
  origin: model
  action: fill
  target: nickname_input
  value:
    param: nickname
  risk: reversible
- id: s07_enter_the_opening_deposit
  intent: Enter the opening deposit amount
  screen: open_sub_account
  origin: model
  action: fill
  target: opening_deposit_input
  value:
    param: opening_deposit
  risk: reversible
- id: s08_select_the_funding_source
  intent: Select the funding source suffix
  screen: open_sub_account
  origin: model
  action: select
  target: fund_from_suffix_select
  value:
    param: fund_from_suffix
  match: label_prefix
  risk: reversible
- id: s09_continue_to_the_review
  intent: Continue to the review screen without opening the account
  screen: open_sub_account
  origin: model
  action: click
  target: continue_button
  risk: safe
  expect:
    screen: review_new_sub_account
    timeout_ms: 10000
- id: s10_confirm_and_open
  intent: Confirm and open the sub-account
  screen: review_new_sub_account
  origin: author
  action: click
  target: confirm_and_open_button
  risk: irreversible
  expect:
    screen: sub_account_opened
    timeout_ms: 10000
- id: s11_read_confirmation
  intent: Read the confirmation message
  screen: sub_account_opened
  origin: author
  action: extract
  target: confirmation_message
  output: confirmation
  risk: safe
success:
  screen: sub_account_opened
  outputs_required:
  - confirmation
