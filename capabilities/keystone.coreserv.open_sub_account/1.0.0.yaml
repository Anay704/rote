      scope:
        kind: frame
        name: content
      path: /sa/review
    - kind: text_present
      scope:
        kind: frame
        name: content
      text: REVIEW NEW SUB-ACCOUNT
  sub_account_opened:
    description: SUB-ACCOUNT OPENED (frame 'content', /sa/commit)
    identify:
