# Open a member sub-account (commits)
# keystone.coreserv.open_sub_account@1.0.0 - generated artifact; review before approving.
# Schema: rote.capability/v1 (see schema/capability.schema.json)
schema_version: rote.capability/v1
id: keystone.coreserv.open_sub_account
version: 1.0.0
title: Open a member sub-account (commits)
description: Runs the steps of keystone.coreserv.open_sub_account_review@1.0.0, then confirms the opening. The confirm
  step is irreversible and pauses for human approval on every execution. Returns the host confirmation message.
app:
  product: keystone.coreserv
  compatible_versions: '>=4.2,<5'
  surface: web
risk: irreversible
inputs:
  member_number:
    type: string
    description: Credit union member number
    classification: pii
    required: true
    pattern: ^\d{1,10}$
    source: caller
  product:
    type: enum
    description: Sub-account product type to open
    classification: public
    required: true
    values:
    - SHARE CERTIFICATE 12 MO
    - MONEY MARKET SHARES
    - HOLIDAY CLUB
    source: caller
  nickname:
    type: string
    description: Nickname for the new sub-account
    classification: internal
    required: true
    source: caller
  opening_deposit:
    type: money
    description: Opening deposit amount for the new sub-account
    classification: financial
    required: true
    source: caller
  fund_from_suffix:
    type: string
    description: Suffix code of the member account funding the opening deposit
    classification: financial
    required: true
    source: caller
outputs:
  confirmation:
    type: string
    description: 'Host confirmation message incl. new suffix and confirmation #'
    classification: internal
outcomes:
- code: RECORD_NOT_FOUND
  description: The member number was valid but no member exists.
  steps: []
- code: PERMISSION_DENIED
  description: Operator lacks permission for this record (e.g. employee accounts).
  steps: []
- code: VALIDATION_REJECTED
  description: The application rejected a field value (format, minimums, insufficient funds).
  steps: []
- code: OPTION_UNAVAILABLE
  description: The screen does not offer the requested option for this record.
  steps:
  - s05_select_the_product_for
  - s08_select_the_funding_source
entry_screen: functions
